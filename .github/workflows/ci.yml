name: Go CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'

      - name: Check Go Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未经过 gofmt 格式化:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests (with Race Detector)
        run: go test -v -race ./...

      - name: Validate Shell Script Syntax
        run: bash -n install.sh

      - name: Build Binary (Verification)
        run: |
          GOOS=linux GOARCH=amd64 go build -tags with_utls -o vless-standalone-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -tags with_utls -o vless-standalone-linux-arm64 .
